<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nebula Break · Motivation</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="motivation">
  <canvas id="galaxy"></canvas>
  <div class="nebula"></div>

  <header class="top">
    <a class="btn small go" data-href="hub.html" href="hub.html">← Back</a>
    <span></span>
  </header>

  <div class="page-head">
    <h2 class="title">👑 Words of Leaders</h2>
    <p class="sub">Tap a card to hear the line in a deep voice, or let all the leaders speak.</p>
  </div>

  <div class="toolbar">
    <button class="btn" id="playAll">▶ Play all</button>
    <button class="btn" id="stopAll">■ Stop</button>

  <main class="cards leaders" id="cards"></main>

  <p class="sub" style="position:relative;z-index:1;padding:0 5vw 80px;font-size:13px">
    Some of these lines are traditionally attributed to the leader.
  </p>

  <script src="script.js"></script>
